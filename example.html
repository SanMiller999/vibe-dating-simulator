<div class="vibe-extension-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Vibe Dating Simulator</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <div class="vibe-settings-section">
        <div class="vibe-settings-section-title">Виджет</div>

        <label class="checkbox_label">
          <input id="vibe_widget_enabled" type="checkbox" checked />
          <span>Показывать плавающий виджет</span>
        </label>

        <div class="vibe-widget-settings-preview">
          <img src="scripts/extensions/third-party/vibe-dating-simulator/assets/vibe-widget-icon.png"
               alt="Иконка Vibe">
          <div>
            <div class="vibe-settings-caption">Плавающий виджет</div>
          </div>
        </div>

        <div class="vibe-slider-row">
          <label for="vibe_widget_size">Размер:</label>
          <input id="vibe_widget_size"
                 type="range"
                 min="24"
                 max="160"
                 step="1"
                 value="46" />
          <output id="vibe_widget_size_value">46px</output>
        </div>

        <div class="vibe-settings-buttons">
          <input id="vibe_find_widget_button"
                 class="menu_button"
                 type="submit"
                 value="Поиск" />
        </div>
      </div>


      <div class="vibe-settings-section vibe-memory-section">
        <div class="vibe-settings-section-title">Память и AI</div>

        <div class="vibe-setting-item">
          <label class="checkbox_label">
            <input id="vibe_memory_auto" type="checkbox" checked />
            <span>Автоматическая память</span>
          </label>
          <div class="vibe-setting-help">
            Vibe сам решает, когда сжимать длинные переписки и сохранять важные факты.
          </div>
        </div>

        <div class="vibe-slider-row">
          <label for="vibe_context_messages">Контекст:</label>
          <input id="vibe_context_messages"
                 type="range"
                 min="10"
                 max="100"
                 step="5"
                 value="30" />
          <output id="vibe_context_messages_value">30</output>
        </div>

        <div class="vibe-slider-row">
          <label for="vibe_chat_memory">Память чата:</label>
          <input id="vibe_chat_memory"
                 type="range"
                 min="5"
                 max="100"
                 step="5"
                 value="30" />
          <output id="vibe_chat_memory_value">30</output>
        </div>

        <div class="vibe-slider-row">
          <label for="vibe_response_tokens">Ответ AI:</label>
          <input id="vibe_response_tokens"
                 type="range"
                 min="128"
                 max="4096"
                 step="128"
                 value="1024" />
          <output id="vibe_response_tokens_value">1024</output>
        </div>

        <label class="checkbox_label">
          <input id="vibe_send_player_profile" type="checkbox" checked />
          <span>Учитывать анкету игрока</span>
        </label>

        <label class="checkbox_label">
          <input id="vibe_send_visual_profile" type="checkbox" checked />
          <span>Учитывать визуальный профиль</span>
        </label>

        <label class="checkbox_label">
          <input id="vibe_send_relationship_memory" type="checkbox" checked />
          <span>Учитывать память отношений</span>
        </label>

        <label class="checkbox_label">
          <input id="vibe_send_world_memory" type="checkbox" checked />
          <span>Учитывать память мира</span>
        </label>

        <div class="vibe-setting-help vibe-memory-note">
          Эти настройки управляют объёмом и составом контекста для AI. Они не меняют сам пользовательский интерфейс Vibe.
        </div>
      </div>

      <div style="margin-top:12px;">
        <input id="vibe_open_button"
               class="menu_button"
               type="submit"
               value="Открыть Vibe" />
      </div>
    </div>
  </div>
</div>
